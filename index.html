<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf8f3" />
    <script>
      // Apply the saved or system theme before first paint, so a reload never
      // flashes the wrong palette. Mirrors hooks/useAppearance.js.
      try {
        const saved = JSON.parse(localStorage.getItem("xpn.appearance"));
        const theme =
          saved === "dark" || saved === "light"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#202224" : "#faf8f3";
      } catch {}
    </script>
    <title>WXPN — Listen live</title>
    <meta
      name="description"
      content="Listen to WXPN 88.5 FM, XPN2 and Kids Corner. Discover your next favorite show, save songs, and find live music."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WXPN" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WXPN" />
    <meta property="og:title" content="WXPN — Listen live" />
    <meta
      property="og:description"
      content="Listen to WXPN 88.5 FM, XPN2 and Kids Corner. Save songs and find live music."
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >The WXPN app needs JavaScript. You can also listen at https://xpn.org/listen/.</noscript
    >
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
