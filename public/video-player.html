<!doctype html>
<!--
  The app's own frame for a Brightcove video (components/WatchPage.jsx).
  Brightcove's player draws the video's title and description over the
  picture whenever it is paused or touched; the watch page already shows
  both under the video, so this page loads the same player into a frame the
  app styles, and hides that overlay. The frame is sandboxed without
  same-origin access, so the player can't reach the app or its storage, and
  the page refuses to run anywhere else.
  If the player can't start here, the page asks the app to show Brightcove's
  own player page instead. The script's hash in the policy below is checked
  by tests/video-player.test.mjs.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'sha256-ryiG1oIbjU2DxIFM/HBdJxQNxXqfSFlkqp0JHkdz+JI=' https://players.brightcove.net; style-src 'unsafe-inline' https://players.brightcove.net; font-src https://players.brightcove.net data:; img-src https: data: blob:; media-src https: blob:; connect-src https:; worker-src blob:; frame-src https:"
    />
    <title>Video</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      video-js,
      .video-js {
        width: 100%;
        height: 100%;
      }
      /* The title and description the player draws over the video. */
      .vjs-dock-text,
      .vjs-dock-shelf,
      .vjs-title-bar {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <script>
      (() => {
        "use strict";
        // Only ever run in the app's sandboxed frame, which has no origin of
        // its own. Opened any other way (directly, or framed without the
        // sandbox) it would run as the app, so it does nothing.
        if (self.origin !== "null" || window.parent === window) return;
        const params = new URLSearchParams(location.search);
        const account = params.get("account") || "";
        const player = params.get("player") || "default";
        const video = params.get("video") || "";
        let settled = false;
        let started = false;

        // Hand the video to Brightcove's own player page instead.
        const fallBack = (why) => {
          if (settled) return;
          settled = true;
          parent.postMessage({ type: "wxpn:video-fallback", why }, "*");
        };
        if (!/^\d+$/.test(account) || !/^[\w-]+$/.test(player) || !/^\d+$/.test(video)) {
          fallBack("link");
          return;
        }

        // Sandboxed, the frame has no storage or cookies; the player gets
        // stand-ins kept in memory rather than errors.
        const memoryStorage = () => {
          const data = new Map();
          return {
            getItem: (k) => data.get(String(k)) ?? null,
            setItem: (k, v) => data.set(String(k), String(v)),
            removeItem: (k) => data.delete(String(k)),
            clear: () => data.clear(),
            key: (i) => [...data.keys()][i] ?? null,
            get length() {
              return data.size;
            },
          };
        };
        for (const name of ["localStorage", "sessionStorage"]) {
          try {
            window[name].getItem("wxpn");
          } catch {
            try {
              Object.defineProperty(window, name, { value: memoryStorage(), configurable: true });
            } catch {
              /* the player copes as it can */
            }
          }
        }
        try {
          void document.cookie;
        } catch {
          try {
            Object.defineProperty(document, "cookie", {
              get: () => "",
              set: () => {},
              configurable: true,
            });
          } catch {
            /* the player copes as it can */
          }
        }

        const el = document.createElement("video-js");
        el.setAttribute("data-account", account);
        el.setAttribute("data-player", player);
        el.setAttribute("data-embed", "default");
        el.setAttribute("data-video-id", video);
        el.setAttribute("data-application-id", "wxpn-app");
        el.setAttribute("controls", "");
        el.setAttribute("playsinline", "");
        document.body.append(el);

        const timer = setTimeout(() => fallBack("timeout"), 10000);
        const script = document.createElement("script");
        script.src = `https://players.brightcove.net/${account}/${player}_default/index.min.js`;
        script.onerror = () => fallBack("script");
        script.onload = () => {
          let p = null;
          try {
            p = window.videojs?.getPlayer?.(el) || window.bc?.(el);
          } catch {
            p = null;
          }
          if (typeof p?.ready !== "function") {
            fallBack("player");
            return;
          }
          p.ready(() => {
            clearTimeout(timer);
            p.on("error", () => {
              if (!started) fallBack("error");
            });
            p.one("playing", () => {
              started = true;
              settled = true;
            });
            // Start at once: with sound where the browser allows it, else
            // waiting for a tap.
            const start = () => p.play()?.catch?.(() => {});
            if (p.readyState() >= 1) start();
            else p.one("loadedmetadata", start);
          });
        };
        document.head.append(script);
      })();
    </script>
  </body>
</html>
