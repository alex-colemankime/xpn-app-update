name: Fetch artwork

# Bundles show artwork and the hosts (bios and portraits, public/hosts) from
# xpn.org into the app, and fetches
# the real video thumbnails the screens page screenshots use. Runs when
# either script changes, or by hand.
on:
  push:
    branches: [main]
    paths:
      - tools/fetch-show-art.mjs
      - tools/fetch-hosts.mjs
      - tools/fetch-video-fixtures.mjs
      - .github/workflows/fetch-assets.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start the deploy and native builds after a commit

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Image resizing for these scripts only; not an app dependency.
      - name: Install sharp
        run: npm i --no-save --no-package-lock sharp@0.34

      - name: Bundle show artwork
        run: node tools/fetch-show-art.mjs

      # xpn.org's host listing failing never costs the show artwork above:
      # the commit still runs, with whatever hosts.json there was.
      - name: Bundle the hosts
        run: node tools/fetch-hosts.mjs
        continue-on-error: true

      - name: Commit show artwork and hosts
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/shows shows.json public/hosts hosts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bundle show artwork and hosts from xpn.org"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with this workflow's token starts no other workflow, so
      # the preview and the native builds are started here by hand.
      - name: Rebuild the preview and the apps
        if: steps.commit.outputs.changed == 'true'
        run: |
          gh workflow run deploy-pages.yml --ref "$GITHUB_REF_NAME"
          gh workflow run native.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch video thumbnails for the screens page
        run: node tools/fetch-video-fixtures.mjs
        env:
          PLAYLISTS: "1876180529963365406,1874727417810648125"

      - name: Publish them on the screens-fixtures branch
        run: |
          cd fixtures
          git init -q -b screens-fixtures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Video fixtures for the screens page"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screens-fixtures
