name: Deploy preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Test
        run: npm test

      # The preview is for design review, so it shows placeholder content.
      - name: Build
        run: npm run build:pages
        env:
          VITE_SHOW_SAMPLES: "true"
          # On a computer, the link opens in a phone, tablet or laptop frame.
          VITE_DEVICE_PREVIEW: "true"
          # The preview's address, for link previews when it is shared.
          VITE_SITE_URL: https://alex-colemankime.github.io/xpn-app-update/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
