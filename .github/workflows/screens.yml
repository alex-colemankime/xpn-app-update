name: Screens

# Retakes screenshots for the screens page (design/screens) from the built
# app, with tools/capture-screens.mjs, and puts them on the screens-out
# branch (and in the "screens" artifact); they go into design/screens/img as
# WebP. Run it by hand (naming shots, or all of them), or it runs when the
# script changes on a branch.
on:
  workflow_dispatch:
    inputs:
      shots:
        description: "Shots to take, space separated (empty: every shot)"
        required: false
        default: ""
  push:
    branches-ignore: [main]
    paths:
      - tools/capture-screens.mjs
      - .github/workflows/screens.yml

permissions:
  contents: write # the screens-out branch

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # As the preview is built: the sample station updates, no reporting.
      - name: Build
        run: npm run build
        env:
          VITE_SHOW_SAMPLES: "true"
          VITE_GA4_ID: "off"

      - name: Capture
        env:
          SHOTS: ${{ inputs.shots }}
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tools/capture-screens.mjs $SHOTS

      - name: Upload the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens-out/

      # Also on the screens-out branch, to look over and copy in with git.
      - name: Publish them on the screens-out branch
        run: |
          cd screens-out
          git init -q -b screens-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screens-out
