name: CI

on:
  push:
    branches-ignore: [main] # main is checked by the deploy workflow
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Known vulnerabilities in what ships in the app (the native runtime
      # included), not in build tools.
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      # The development tools too, except advisories listed (with why they
      # don't apply) in audit-exceptions.json.
      - name: Full dependency audit
        run: node tools/audit.mjs

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Test
        run: npm test

      # Playwright's browser, kept between runs for the version installed
      # (the install below then only adds the system libraries).
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright's browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The main journeys in a real browser, against fixtures (tests/e2e).
      # They build the app to run it, so that build is the check that it
      # builds.
      - name: End-to-end tests
        run: npx playwright install --with-deps chromium && npm run e2e
